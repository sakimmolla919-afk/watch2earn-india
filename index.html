<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch2Earn India</title>
  
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Firebase App & Database (v9 Compatibility Mode) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #1e293b;
      width: 100%;
      max-width: 420px;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      margin-bottom: 16px;
      text-align: center;
    }
    .profile-title {
      font-size: 20px;
      font-weight: bold;
      color: #94a3b8;
      margin-bottom: 8px;
    }
    .user-name {
      font-size: 24px;
      font-weight: bold;
      color: #ffffff;
      margin-bottom: 6px;
    }
    .balance {
      font-size: 32px;
      font-weight: 800;
      color: #22c55e;
      margin: 10px 0;
    }
    .phone-info {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 14px;
    }
    .share-btn {
      background: #2563eb;
      color: #ffffff;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .share-btn:hover {
      background: #1d4ed8;
    }
    .tasks-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
      max-width: 420px;
    }
    .task-card {
      background: #1e293b;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      border: 1px solid #334155;
    }
    .task-title {
      font-size: 15px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 6px;
    }
    .reward {
      font-size: 14px;
      color: #38bdf8;
      font-weight: bold;
      margin-bottom: 12px;
    }
    .watch-btn {
      background: #16a34a;
      color: #ffffff;
      border: none;
      width: 100%;
      padding: 10px 0;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    .watch-btn:disabled {
      background: #475569;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <!-- Profile Card -->
  <div class="card">
    <div class="profile-title">Watch2Earn India</div>
    <div class="user-name" id="user-name">User</div>
    <div class="balance" id="user-balance">Balance: ₹0.00</div>
    <div class="phone-info" id="phone-info">Phone Number: Not Linked</div>
    <button class="share-btn" id="phone-btn" onclick="requestPhoneNumber()">📱 Share Phone Number</button>
  </div>

  <!-- Tasks Section -->
  <div class="tasks-grid" id="tasks-container">
    <!-- Tasks will be generated dynamically -->
  </div>

  <script>
    // 1. Initialize Telegram WebApp
    const tg = window.Telegram.WebApp;
    tg.expand();

    // 2. Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyDummyKeyForTemplate",
      authDomain: "watch2earn-india-17633.firebaseapp.com",
      databaseURL: "https://watch2earn-india-17633-default-rtdb.firebaseio.com",
      projectId: "watch2earn-india-17633",
      storageBucket: "watch2earn-india-17633.appspot.com",
      messagingSenderId: "1234567890",
      appId: "1:1234567890:web:abcdef123456"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // User details from Telegram
    const tgUser = tg.initDataUnsafe?.user || { id: "test_user_123", first_name: "User" };
    const userId = tgUser.id;
    const userName = tgUser.first_name + (tgUser.last_name ? " " + tgUser.last_name : "");

    // Adsterra Direct Link
    const ADSTERRA_DIRECT_LINK = "https://www.profitableratecpmnetwork.com/gts70p4m?key=a78dc8da9a6143f469c74354c1340d60";

    let currentBalance = 0.00;

    // Load User Data from Firebase
    document.getElementById("user-name").innerText = userName;

    const userRef = db.ref("users/" + userId);
    userRef.on("value", (snapshot) => {
      const data = snapshot.val();
      if (data) {
        currentBalance = data.balance || 0.00;
        document.getElementById("user-balance").innerText = `Balance: ₹${currentBalance.toFixed(2)}`;
        
        if (data.phone) {
          document.getElementById("phone-info").innerText = `Phone Number: ${data.phone}`;
          document.getElementById("phone-btn").style.display = "none";
        }
      } else {
        // Create initial record
        userRef.set({
          name: userName,
          balance: 0.00,
          joined: new Date().toISOString()
        });
      }
    });

    // Request Phone Number via Telegram
    function requestPhoneNumber() {
      tg.requestContact((sent, response) => {
        if (sent) {
          const phone = response?.responseUnsafe?.contact?.phone_number;
          if (phone) {
            userRef.update({ phone: phone });
            document.getElementById("phone-info").innerText = `Phone Number: ${phone}`;
            document.getElementById("phone-btn").style.display = "none";
          }
        }
      });
    }

    // Generate 10 Video Tasks
    const tasksContainer = document.getElementById("tasks-container");
    for (let i = 1; i <= 10; i++) {
      const taskCard = document.createElement("div");
      taskCard.className = "task-card";
      taskCard.innerHTML = `
        <div class="task-title">Video #${i}</div>
        <div class="reward">Reward: ₹1.00</div>
        <button class="watch-btn" id="task-btn-${i}" onclick="startTask(${i})">Watch</button>
      `;
      tasksContainer.appendChild(taskCard);
    }

    // Start Task & Redirect to Adsterra
    function startTask(taskId) {
      const btn = document.getElementById(`task-btn-${taskId}`);
      
      // 1. Open Adsterra Direct Link
      if (tg.openLink) {
        tg.openLink(ADSTERRA_DIRECT_LINK);
      } else {
        window.open(ADSTERRA_DIRECT_LINK, "_blank");
      }

      // 2. Start 30 Seconds Countdown Timer
      let timeLeft = 30;
      btn.disabled = true;
      
      const timer = setInterval(() => {
        btn.innerText = `Wait ${timeLeft}s`;
        timeLeft--;

        if (timeLeft < 0) {
          clearInterval(timer);
          btn.innerText = "Completed ✓";
          
          // Add Reward ₹1.00 to Firebase
          currentBalance += 1.00;
          userRef.update({ balance: currentBalance });
        }
      }, 1000);
    }
  </script>
</body>
</html>
